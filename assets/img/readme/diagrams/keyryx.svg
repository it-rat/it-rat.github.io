<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 396" width="996" height="396" role="img" aria-label="Keyryx: custody signs for the consumers it grants and publishes key sets, and a read-only witness reports what changed on the record">
  <title>Keyryx: custody signs for the consumers it grants and publishes key sets, and a read-only witness reports what changed on the record</title>
  <rect x="-18" y="-18" width="996" height="396" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="395" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

        <defs>
          <marker id="kx-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/></marker>
          <style>
            .kx-t{font-family:ui-monospace,Menlo,monospace}
            .kx-h{fill:#E9EFF6;font-size:12.5px;font-weight:700}
            .kx-s{fill:#8A97A6;font-size:10.5px}
            .kx-f{fill:#5A6675;font-size:10.5px}
            @media (prefers-reduced-motion: reduce){ .kx-anim{display:none} }
          </style>
        </defs>
        <g>
          <rect x="20" y="30" width="236" height="150" rx="14" fill="#10161F" stroke="#2a3547"/>
          <text x="40" y="58" class="kx-h">Consumers</text>
          <text x="40" y="84" class="kx-s">wardryx: approval tokens</text>
          <text x="40" y="104" class="kx-s">trailryx: sealed roots</text>
          <text x="40" y="124" class="kx-s">vouchryx: its token key</text>
          <text x="40" y="160" class="kx-f">granted by policy, one way in each</text>

          <rect x="330" y="30" width="270" height="150" rx="14" fill="#10161F" stroke="#FDE68A"/>
          <text x="350" y="58" class="kx-h">keyryx custody</text>
          <text x="350" y="84" class="kx-s">wrapped keys, state MAC</text>
          <text x="350" y="104" class="kx-s">use log, one line per use</text>
          <text x="350" y="124" class="kx-s">publishes key sets with overlap</text>
          <text x="350" y="160" class="kx-f">never on a request path</text>

          <rect x="690" y="30" width="250" height="150" rx="14" fill="#10161F" stroke="#2a3547"/>
          <text x="710" y="58" class="kx-h">Verifiers</text>
          <text x="710" y="84" class="kx-s">cache /v1/jwks/{name}</text>
          <text x="710" y="104" class="kx-s">cache /v1/statements/{kid}</text>
          <text x="710" y="124" class="kx-s">verify offline</text>
          <text x="710" y="160" class="kx-f">keep working when custody is down</text>

          <rect x="20" y="230" width="236" height="110" rx="14" fill="#10161F" stroke="#2a3547"/>
          <text x="40" y="258" class="kx-h">Event bus</text>
          <text x="40" y="284" class="kx-s">events/*.ndjson</text>
          <text x="40" y="304" class="kx-f">read only</text>

          <rect x="330" y="230" width="270" height="110" rx="14" fill="#10161F" stroke="#FDE68A"/>
          <text x="350" y="258" class="kx-h">keyryx witness</text>
          <text x="350" y="284" class="kx-s">own key, own volume, own uid</text>
          <text x="350" y="304" class="kx-f">no network, reads only</text>

          <rect x="690" y="230" width="250" height="110" rx="14" fill="#10161F" stroke="#2a3547"/>
          <text x="710" y="258" class="kx-h">Findings</text>
          <text x="710" y="284" class="kx-s">keyryx.ndjson, agent-events</text>
          <text x="710" y="304" class="kx-f">signed tree heads in its log</text>
        </g>
        <g stroke="#5A6675" stroke-width="1.5" fill="none">
          <line x1="256" y1="105" x2="330" y2="105" marker-end="url(#kx-a)"/>
          <line x1="600" y1="105" x2="690" y2="105" marker-end="url(#kx-a)"/>
          <line x1="256" y1="285" x2="330" y2="285" marker-end="url(#kx-a)"/>
          <line x1="600" y1="285" x2="690" y2="285" marker-end="url(#kx-a)"/>
          <line x1="465" y1="230" x2="465" y2="180" stroke-dasharray="4 4" marker-end="url(#kx-a)"/>
        </g>
        <text x="262" y="98" class="kx-s">sign</text>
        <text x="606" y="98" class="kx-s">JWKS</text>
        <text x="262" y="278" class="kx-s">read</text>
        <text x="606" y="278" class="kx-s">findings</text>
        <text x="472" y="212" class="kx-f">statements, when a URL is set</text>
      
  <g fill="none">
  <line x1="256" y1="105" x2="330" y2="105" pathLength="100" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.00s" repeatCount="indefinite"/></line>
  <line x1="600" y1="105" x2="690" y2="105" pathLength="100" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.37s" repeatCount="indefinite"/></line>
  <line x1="256" y1="285" x2="330" y2="285" pathLength="100" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.74s" repeatCount="indefinite"/></line>
  <line x1="600" y1="285" x2="690" y2="285" pathLength="100" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.11s" repeatCount="indefinite"/></line>
  <line x1="465" y1="230" x2="465" y2="180" pathLength="100" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.48s" repeatCount="indefinite"/></line>
  </g>
</svg>
