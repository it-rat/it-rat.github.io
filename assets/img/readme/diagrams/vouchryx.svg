<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 418" width="996" height="418" role="img" aria-label="Vouchryx: a subject token, an actor token and a DPoP proof are exchanged for a short-lived delegation token, verified offline and revoked by a polled list">
  <title>Vouchryx: a subject token, an actor token and a DPoP proof are exchanged for a short-lived delegation token, verified offline and revoked by a polled list</title>
  <rect x="-18" y="-18" width="996" height="418" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="417" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

        <defs>
          <marker id="vx-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5A6675"/></marker>
          <marker id="vx-r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#FF574B"/></marker>
          <style>
            .vx-t{font-family:ui-monospace,Menlo,monospace}
            @media (prefers-reduced-motion: reduce){
              .vx-anim{display:none}
            }
          </style>
        </defs>
        <g class="vx-t" text-anchor="middle">

          <!-- inputs -->
          <rect x="12" y="26" width="222" height="46" rx="11" fill="#141C27" stroke="#93A8C4" stroke-width="1.2"/>
          <text x="123" y="47" fill="#93A8C4" font-size="12" font-weight="700">subject_token</text>
          <text x="123" y="63" fill="#8A97A6" font-size="10.5">from your IdP &#183; user://acme/ada</text>

          <rect x="12" y="88" width="222" height="46" rx="11" fill="#141C27" stroke="#93A8C4" stroke-width="1.2"/>
          <text x="123" y="109" fill="#93A8C4" font-size="12" font-weight="700">actor_token</text>
          <text x="123" y="125" fill="#8A97A6" font-size="10.5">agent://acme/triage</text>

          <rect x="12" y="150" width="222" height="46" rx="11" fill="#141C27" stroke="#8B9DFF" stroke-width="1.2"/>
          <text x="123" y="171" fill="#8B9DFF" font-size="12" font-weight="700">DPoP proof</text>
          <text x="123" y="187" fill="#8A97A6" font-size="10.5">signed by the holder key</text>

          <path d="M238 49 L332 96" stroke="#5A6675" stroke-width="1.2" fill="none" marker-end="url(#vx-a)"/>
          <path d="M238 111 L332 111" stroke="#5A6675" stroke-width="1.2" fill="none" marker-end="url(#vx-a)"/>
          <path d="M238 173 L332 126" stroke="#5A6675" stroke-width="1.2" fill="none" marker-end="url(#vx-a)"/>

          <!-- the exchange -->
          <rect x="336" y="72" width="196" height="80" rx="13" fill="#161F2C" stroke="#8B9DFF" stroke-width="1.6"/>
          <text x="434" y="100" fill="#8B9DFF" font-size="13" font-weight="700">vouchryx</text>
          <text x="434" y="119" fill="#E9EFF6" font-size="11">POST /v1/token</text>
          <text x="434" y="136" fill="#8A97A6" font-size="10.5">RFC 8693 &#183; ES256 &#183; 300s</text>

          <!-- the minted token -->
          <path d="M536 112 L636 112" stroke="#5A6675" stroke-width="1.2" fill="none" marker-end="url(#vx-a)"/>
          <rect x="640" y="56" width="308" height="112" rx="13" fill="#141C27" stroke="#8B9DFF" stroke-width="1.2"/>
          <text x="794" y="80" fill="#8B9DFF" font-size="12" font-weight="700">the token it mints</text>
          <text x="794" y="102" fill="#E9EFF6" font-size="11">sub: user://acme/ada</text>
          <text x="794" y="121" fill="#E9EFF6" font-size="11">act.sub: agent://acme/triage</text>
          <text x="794" y="140" fill="#8B9DFF" font-size="11">cnf.jkt: the holder key thumbprint</text>
          <text x="794" y="158" fill="#8A97A6" font-size="10.5">exp in five minutes, jti recorded</text>

          <!-- the enforcement point -->
          <path d="M794 172 L794 214" stroke="#5A6675" stroke-width="1.2" fill="none" marker-end="url(#vx-a)"/>
          <rect x="622" y="218" width="330" height="86" rx="13" fill="#161F2C" stroke="#2DD4BF" stroke-width="1.4"/>
          <text x="787" y="244" fill="#2DD4BF" font-size="12.5" font-weight="700">enforcement point</text>
          <text x="787" y="264" fill="#8A97A6" font-size="10.5">a gateway, a proxy, whatever is in the path</text>
          <text x="787" y="285" fill="#E9EFF6" font-size="11">verifies offline &#183; needs a fresh proof per call</text>

          <!-- offline verification -->
          <rect x="336" y="196" width="196" height="46" rx="11" fill="#141C27" stroke="#93A8C4" stroke-width="1.2"/>
          <text x="434" y="217" fill="#93A8C4" font-size="11.5" font-weight="700">/.well-known/jwks.json</text>
          <text x="434" y="233" fill="#8A97A6" font-size="10.5">public keys, no round trip</text>
          <path d="M536 219 L618 244" stroke="#5A6675" stroke-width="1.2" fill="none" marker-end="url(#vx-a)"/>

          <!-- the revocation path -->
          <rect x="12" y="252" width="196" height="46" rx="11" fill="#141C27" stroke="#FF574B" stroke-width="1.2"/>
          <text x="110" y="273" fill="#FF574B" font-size="12" font-weight="700">POST /v1/revoke</text>
          <text x="110" y="289" fill="#8A97A6" font-size="10.5">actor and reason required</text>

          <rect x="336" y="252" width="196" height="46" rx="11" fill="#141C27" stroke="#FF574B" stroke-width="1.2"/>
          <text x="434" y="273" fill="#FF574B" font-size="11.5" font-weight="700">/v1/revocations</text>
          <text x="434" y="289" fill="#8A97A6" font-size="10.5">polled, and carries as_of</text>

          <path d="M212 275 L332 275" stroke="#FF574B" stroke-width="1.2" fill="none" marker-end="url(#vx-r)"/>
          <path d="M536 275 L618 268" stroke="#FF574B" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#vx-r)"/>

          <!-- what the enforcement point answers, before and after. Two lines,
               never one line crossfading between them: stacked at one anchor
               they overlapped for half a second on every swap, and the longer
               red string read as an artefact printed over the green one. -->
          <text x="250" y="326" font-size="11.5" fill="#34D399" text-anchor="start">200 &#183; the chain is proven</text>
          <text x="250" y="346" font-size="11.5" fill="#FF574B" text-anchor="start">after /v1/revoke: 401 &#183; reason=BadToken</text>

          <!-- the token travelling, and the revocation catching it -->
          <g class="vx-anim">
            <rect x="-11" y="-4" width="22" height="8" rx="4" fill="#8B9DFF" opacity=".85" transform="translate(536,112)">
              <animateMotion path="M536 112 L636 112 L794 172 L794 214" dur="4.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
            </rect>
            <circle r="4" fill="#FF574B" opacity=".9" transform="translate(212,275)">
              <animateMotion path="M212 275 L332 275 L536 275 L700 268" dur="9s" begin="3.6s" repeatCount="indefinite"/>
            </circle>
          </g>

          <text x="250" y="368" fill="#5A6675" font-size="10.5" text-anchor="start">nothing here asks vouchryx at request time, on purpose</text>
        </g>
      
  <g fill="none">
  <path d="M238 49 L332 96" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.00s" repeatCount="indefinite"/></path>
  <path d="M238 111 L332 111" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.37s" repeatCount="indefinite"/></path>
  <path d="M238 173 L332 126" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-0.74s" repeatCount="indefinite"/></path>
  <path d="M536 112 L636 112" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.11s" repeatCount="indefinite"/></path>
  <path d="M794 172 L794 214" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.48s" repeatCount="indefinite"/></path>
  <path d="M536 219 L618 244" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-1.85s" repeatCount="indefinite"/></path>
  <path d="M212 275 L332 275" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-2.22s" repeatCount="indefinite"/></path>
  <path d="M536 275 L618 268" fill="none" pathLength="100" stroke="#8B9DFF" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 100" stroke-dashoffset="7"><animate attributeName="stroke-dashoffset" from="7" to="-100" dur="2.4s" begin="-2.59s" repeatCount="indefinite"/></path>
  </g>
</svg>
