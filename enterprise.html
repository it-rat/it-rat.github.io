<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genaryx &#183; IT-RAT</title>
<!-- This page used to be the Genaryx page, under a name that described a
     product shape this stack does not have. It stays as a redirect because
     links, bookmarks and search results outlive a rename, and a 404 is a
     worse answer than the page the reader was looking for. -->
<!-- No noindex here on purpose. It used to sit beside the canonical below, and
     the two say opposite things: one asks Google to fold this URL into
     genaryx.html, the other asks it to drop the URL entirely, which can carry
     the drop over to the target. A refresh plus a canonical is the pair Google
     documents for a page that moved. -->
<link rel="canonical" href="https://it-rat.com/genaryx.html">
<meta http-equiv="refresh" content="0; url=genaryx.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="assets/site.css">
<script>location.replace("genaryx.html" + location.hash);</script>
</head>
<body>
<section class="sec">
  <div class="wrap" style="padding:80px 0;text-align:center">
    <p class="lede">This page moved to <a href="genaryx.html" style="color:var(--fg);border-bottom:1px solid var(--line-2)">genaryx.html</a>.</p>
  </div>
</section>
</body>
</html>
